[package]
name = "fontisan_cdylib"
version = "0.0.0"
edition = "2021"
publish = false
description = "C ABI of the fontisan engine as a shared library for the Ruby `ffi` tier (no magnus)"

[lib]
name = "fontisan_cdylib"
crate-type = ["cdylib"]

# Standalone: not a member of any enclosing workspace.
[workspace]

[dependencies]
# TEMPORARY (decision D3: the crate is not on crates.io yet). Replace with
# `fontisan = { version = "=<release>", features = ["ffi"] }` once published.
fontisan = { git = "https://github.com/fontist/fontisan-rs", rev = "daffb3f45b67517e924a3e5d0e113a2ecbde9959", features = ["ffi"] }
