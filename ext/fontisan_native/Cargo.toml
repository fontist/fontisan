[package]
name = "fontisan_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "The :native tier of the fontisan gem: the fontisan-rs engine through magnus."

[lib]
crate-type = ["cdylib"]

[dependencies]
# TEMPORARY (decision D3: the crate is not on crates.io yet). Replace with
# `fontisan = "=<version>"` once published. The rev must be a commit on
# fontist/fontisan-rs; keep it equal to the rev in ext/fontisan_cdylib/Cargo.toml.
fontisan = { git = "https://github.com/fontist/fontisan-rs", rev = "10bbd1c7a961dfe383879f2c5cf995c1abe7d9df" }
magnus = "=0.8.4"
rb-sys = { version = "=0.9.130", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
