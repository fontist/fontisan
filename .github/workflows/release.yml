# Native-gem release, the parsanol-ruby way (fontisan#173): every release
# publishes the source gem AND a precompiled gem per platform, so
# `gem install fontisan` never compiles anything. The whole flow is one
# workflow: dispatch a bump -> the bump PR auto-merges -> the merged commit
# is tagged -> gem-build.yml (the same pipeline CI validates, called at that
# SHA) builds and smokes every gem -> all of them are pushed to RubyGems.
#
# A version bump landing on main IS the release decision: the push trigger
# on lib/fontisan/version.rb releases whatever version is already there
# (the leptris-ruby#452 pattern). No tag trigger: the tags+paths combination
# is under-documented and can silently break both; the release run creates
# and pushes its tag itself.
name: release

permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (use 'skip' to release existing version)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - pre
          - rc
          - beta
          - alpha
          - custom
          - skip
        default: "patch"
      custom_version:
        description: "Custom version (only used when bump_type is 'custom', e.g., 0.5.0, 0.5.0.rc.1)"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "lib/fontisan/version.rb"

# ONE release at a time — fixed group so a push-triggered run and a manual
# dispatch serialize (interpolated groups would let them race into a
# half-published gem), and a duplicate QUEUES behind an in-flight publish
# instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install gem-release
        run: gem install gem-release

      - name: Determine and bump version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION_FILE="lib/fontisan/version.rb"

          # Empty bump_type = the auto-release trigger (a version bump
          # landing on main IS the release decision): read the version
          # already on main and ship it.
          if [ -z "${{ inputs.bump_type }}" ] || [ "${{ inputs.bump_type }}" = "skip" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Skipping version bump, using current version..."
            VERSION=$(grep "VERSION =" "$VERSION_FILE" | sed 's/.*"\([^"]*\)".*/\1/')
            SHA=$(git rev-parse HEAD)
            TAG="v$VERSION"

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
              echo "Tag $TAG already exists on the remote"
            elif git tag -l | grep -q "^${TAG}$"; then
              echo "Tag $TAG exists locally but not on the remote"
            else
              echo "Creating tag $TAG..."
              git tag -a "$TAG" -m "Release $VERSION"
            fi
            # Outputs feed the tag push, the build checkout and the
            # GitHub-release step — dropping them silently skips the tag
            # and reds the release step.
            {
              echo "version=$VERSION"
              echo "tag=$TAG"
              echo "sha=$SHA"
            } >> "$GITHUB_OUTPUT"
          else
            # Dispatch-bump: the version bump lands as a PR (main is
            # protected against direct pushes), auto-merge lands it once
            # the PR's CI is green, and THAT merge triggers this workflow's
            # push path — which publishes. This run only prepares the
            # bump; its build and publish jobs skip (release=false).
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.bump_type }}" = "custom" ]; then
              VERSION_ARG="${{ inputs.custom_version }}"
            else
              VERSION_ARG="${{ inputs.bump_type }}"
            fi

            BRANCH="release/bump-$VERSION_ARG-$(date +%s)"
            git checkout -b "$BRANCH"
            gem bump --version "$VERSION_ARG" --file "$VERSION_FILE"
            VERSION=$(grep "VERSION =" "$VERSION_FILE" | sed 's/.*"\([^"]*\)".*/\1/')
            git push origin "$BRANCH"

            {
              echo "Version bump to ${VERSION} for release (#173 native-gem releases)."
              echo ""
              echo "Merging publishes: the merge triggers the release workflow's push path, which tags this commit and builds the source gem plus every platform gem (the parsanol-ruby flow)."
            } > /tmp/bump-pr-body.md
            PR_URL=$(gh pr create \
              --title "Release: bump fontisan to ${VERSION}" \
              --body-file /tmp/bump-pr-body.md \
              --head "$BRANCH")
            echo "Bump PR: $PR_URL (auto-merge enabled; waiting for its CI + merge)"
            # Tolerate the already-mergeable case: when the PR has no
            # pending checks, the enable-auto-merge mutation fails with
            # "Pull request is in clean status" BECAUSE GitHub merged it
            # immediately — an error payload that must not kill the
            # release after the bump landed.
            if ! gh pr merge --auto --squash "$PR_URL"; then
              gh pr view "${PR_URL##*/}" --json state,mergeable --jq '"\(.state) mergeable=\(.mergeable)"'
              if [ "$(gh pr view "${PR_URL##*/}" --json state --jq .state)" = "OPEN" ] &&
                 [ "$(gh pr view "${PR_URL##*/}" --json mergeable --jq .mergeable)" = "MERGEABLE" ]; then
                gh pr merge "${PR_URL##*/}" --squash
              fi
            fi

            # Wait for the auto-merge to land. The merge's push cannot
            # trigger this workflow (GITHUB_TOKEN events are suppressed),
            # so this run continues the release itself: tag the merged
            # head and proceed downstream on the merge commit.
            PR_NUMBER=$(basename "$PR_URL")
            for _ in $(seq 1 120); do
              STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
              [ "$STATE" = "MERGED" ] && break
              [ "$STATE" = "CLOSED" ] && {
                echo "Bump PR was closed without merging"
                exit 1
              }
              sleep 30
            done
            [ "$STATE" = "MERGED" ] || {
              echo "Timed out waiting for the bump PR to merge (60m)"
              exit 1
            }

            git fetch origin main
            git checkout -q main
            git pull -q origin main
            SHA=$(git rev-parse HEAD)
            TAG="v${VERSION}"
            git tag -a "$TAG" -m "Release $VERSION" "$SHA"
            git push origin "$TAG"
            {
              echo "version=$VERSION"
              echo "tag=$TAG"
              echo "sha=$SHA"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push version bump commit and tag
        run: |
          # Only needed when the version was not bumped by gem bump
          # (skip mode / auto-release: HEAD is already on main, only
          # the tag needs pushing)
          if [ -z "${{ inputs.bump_type }}" ] || [ "${{ inputs.bump_type }}" = "skip" ]; then
            git push origin HEAD:${{ github.ref_name }} || true
            # A re-release of an already-tagged version (resuming a
            # publish that failed downstream) must not fail on the
            # existing identical tag.
            if ! git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
              git push origin ${{ steps.version.outputs.tag }}
            fi
          fi

  # Platform gems + per-platform smokes + java gem + JRuby smoke + musl
  # smoke + no-toolchain source proof: the exact pipeline push/PR runs
  # validate, called at the release SHA. Artifacts from this call feed
  # the publish job; the call itself is the release gate.
  build:
    name: Build and smoke all gems
    needs: prepare-version
    if: needs.prepare-version.outputs.release == 'true'
    uses: ./.github/workflows/gem-build.yml
    with:
      ref: ${{ needs.prepare-version.outputs.sha }}

  publish:
    name: Publish gems to RubyGems
    needs: [prepare-version, build]
    if: needs.prepare-version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # Recompute the platform set the build matrix used (same
      # fetch-ci-data inputs, same exclusions — see gem-build.yml), so
      # the verify below asserts the shipped set exactly instead of a
      # hand-maintained list.
      - id: fetch
        uses: oxidize-rb/actions/fetch-ci-data@v1
        with:
          supported-ruby-platforms: |
            exclude: [x64-mingw32, aarch64-mingw-ucrt]

      - name: Download the built gems
        uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: pkg/

      - name: Download the java gem
        uses: actions/download-artifact@v4
        with:
          name: java-gem
          path: pkg/

      # The release ships exactly: source + java + the x64-mingw32 stub
      # + one gem per cross-compile platform. Anything else in pkg/ means
      # a stray artifact slipped in.
      - name: Verify the expected gem set
        env:
          # The fetch result is JSON with quotes and braces — inlining it
          # via ${{ }} shatters the script's quoting, so it travels as an
          # environment variable instead.
          FETCH_RESULT: ${{ steps.fetch.outputs.result }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          expected=(
            "fontisan-${VERSION}.gem"
            "fontisan-${VERSION}-java.gem"
            "fontisan-${VERSION}-x64-mingw32.gem"
          )
          # Hyphenated jq keys need the bracket-quote form: dot form
          # parses as subtraction (.supported - ruby - platforms).
          while read -r platform; do
            expected+=("fontisan-${VERSION}-${platform}.gem")
          done < <(jq -r '.["supported-ruby-platforms"][]' <<<"$FETCH_RESULT")
          printf '%s\n' "${expected[@]}" > /tmp/expected.txt
          for gem in "${expected[@]}"; do
            [ -f "pkg/$gem" ] || { echo "::error::missing $gem"; exit 1; }
          done
          unexpected=0
          for gem in pkg/fontisan-*.gem; do
            if ! grep -q -F -x "$(basename "$gem")" /tmp/expected.txt; then
              echo "::error::unexpected gem in pkg/: $(basename "$gem")"
              unexpected=1
            fi
          done
          exit "$unexpected"

      # Trusted publishing: fontisan is registered on rubygems.org for
      # fontist/fontisan + release.yml. The OIDC exchange needs the
      # id-token: write this workflow grants.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gems
        working-directory: pkg/
        run: |
          set +e  # Disable exit on error so we can capture and show errors
          echo "Listing gems to push..."
          ls -l
          final_exit=0
          for i in *.gem; do
            if [ -f "$i" ]; then
              echo "Pushing $i..."
              gem push "$i" 2>&1 | tee push.out
              gemerr=${PIPESTATUS[0]}
              echo "gem push exit code: $gemerr"
              if [ "$gemerr" -ne 0 ]; then
                if ! grep -q "Repushing of gem" push.out; then
                  echo "::error::Failed to push $i (exit code: $gemerr)"
                  final_exit=$gemerr
                else
                  echo "Gem already pushed, continuing..."
                fi
              fi
            fi
          done
          exit "$final_exit"

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare-version.outputs.tag }}
          allowUpdates: true
          generateReleaseNotes: true
          draft: ${{ inputs.draft == true || inputs.draft == 'true' }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          skipIfReleaseExists: true
          prerelease: ${{ contains(needs.prepare-version.outputs.version, 'rc') || contains(needs.prepare-version.outputs.version, 'pre') || contains(needs.prepare-version.outputs.version, 'beta') || contains(needs.prepare-version.outputs.version, 'alpha') }}
